# Minimal local Airflow (standalone mode) for development. Not for production.
# Usage:
#   export GCP_PROJECT=your-project-id
#   docker compose up
# Airflow UI: http://localhost:8080  (the admin password is printed in the container logs)
#
# BigQuery access: mount a service-account key and point GOOGLE_APPLICATION_CREDENTIALS at it
# (uncomment the lines below). Never commit the key file.
services:
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      PYTHONPATH: /opt/airflow/project
      GCP_PROJECT: ${GCP_PROJECT:-your-project-id}
      BQ_DATASET: ${BQ_DATASET:-weather_dw}
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas pyarrow google-cloud-bigquery"
      # GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/sa.json
    volumes:
      - .:/opt/airflow/project
      # - ./keys:/opt/airflow/keys:ro
